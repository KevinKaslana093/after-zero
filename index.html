<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060914">
  <link rel="icon" href="data:,">
  <meta name="description" content="《零点之后》——都市怪谈×深夜电台男性向视觉小说">
  <title>零点之后 · AFTER ZERO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section id="title-screen" class="screen active" aria-label="标题画面">
      <div class="title-bg"></div>
      <div class="rain rain-a"></div>
      <div class="rain rain-b"></div>
      <div class="title-vignette"></div>
      <div class="title-content">
        <p class="eyebrow">FM 00:13 · ORIGINAL VISUAL NOVEL</p>
        <h1><span>零点</span>之后</h1>
        <p class="title-en">AFTER <strong>ZERO</strong></p>
        <p class="tagline">有些来电，来自尚未发生的明天。</p>
        <nav class="title-menu" aria-label="主菜单">
          <button id="new-game-btn" class="menu-button primary"><span>NEW SIGNAL</span><b>开始新故事</b></button>
          <button id="continue-btn" class="menu-button" disabled><span>CONTINUE</span><b>继续上次进度</b></button>
          <button id="collection-btn" class="menu-button"><span>ARCHIVE</span><b>终夜档案</b></button>
          <button id="title-settings-btn" class="menu-button"><span>CONFIG</span><b>系统设置</b></button>
        </nav>
        <div class="title-progress">
          <span>RECEIVED ENDINGS</span>
          <div id="ending-pips" class="ending-pips" aria-label="结局收集进度"></div>
          <b id="ending-count">0 / 5</b>
        </div>
      </div>
      <footer class="title-footer">建议佩戴耳机 · 所有可攻略角色均为成年人</footer>
    </section>

    <section id="game-screen" class="screen" aria-label="游戏画面">
      <div id="bg-a" class="game-bg active"></div>
      <div id="bg-b" class="game-bg"></div>
      <div class="scene-grade"></div>
      <div class="game-rain"></div>

      <header class="game-header">
        <div class="chapter-mark">
          <span id="chapter-number">00</span>
          <div><small>CHAPTER</small><strong id="chapter-title">失真</strong></div>
        </div>
        <div class="signal-meter" aria-label="信号强度">
          <span>SIGNAL</span><i></i><i></i><i></i><i></i><i></i>
        </div>
      </header>

      <div id="portrait-wrap" class="portrait-wrap hidden" aria-hidden="true">
        <div id="portrait-glow" class="portrait-glow"></div>
        <img id="portrait" src="" alt="">
        <div id="route-tag" class="route-tag"></div>
      </div>

      <div id="location-card" class="location-card hidden">
        <small>LOCATION</small><strong id="location-name"></strong>
      </div>

      <div id="choice-layer" class="choice-layer hidden" role="dialog" aria-label="剧情选择">
        <p id="choice-prompt">你的选择是——</p>
        <div id="choices" class="choices"></div>
      </div>

      <section id="dialogue-box" class="dialogue-box" tabindex="0" aria-label="对话框">
        <div class="dialogue-accent"></div>
        <div class="speaker-row">
          <span id="speaker-en">NARRATION</span>
          <h2 id="speaker-name">旁白</h2>
        </div>
        <p id="dialogue-text"></p>
        <button id="advance-indicator" class="advance-indicator" aria-label="继续">⌄</button>
        <div class="quick-menu">
          <button data-action="auto">AUTO</button>
          <button data-action="skip">SKIP</button>
          <button data-action="log">LOG</button>
          <button data-action="menu">MENU</button>
        </div>
      </section>
    </section>

    <section id="ending-screen" class="screen" aria-label="结局画面">
      <div id="ending-bg" class="ending-bg"></div>
      <div class="ending-shade"></div>
      <div class="ending-content">
        <p>PROLOGUE ENDING RECEIVED</p>
        <div id="ending-index" class="ending-index">01 / 05</div>
        <h2 id="ending-title">她记得你的声音</h2>
        <p id="ending-subtitle"></p>
        <div class="ending-line"></div>
        <p id="ending-quote" class="ending-quote"></p>
        <div class="ending-actions">
          <button id="ending-title-btn" class="glass-button">返回标题</button>
          <button id="ending-restart-btn" class="glass-button primary">选择其他信号</button>
        </div>
      </div>
    </section>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-backdrop" data-close-modal></div>
      <section class="modal-panel">
        <header>
          <div><small id="modal-kicker">SYSTEM</small><h2 id="modal-title">系统菜单</h2></div>
          <button class="close-button" data-close-modal aria-label="关闭">×</button>
        </header>
        <div id="modal-body" class="modal-body"></div>
      </section>
    </div>

    <div id="name-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-backdrop"></div>
      <section class="name-panel">
        <p class="eyebrow">IDENTIFY YOUR SIGNAL</p>
        <h2>告诉她们，你的名字</h2>
        <p>你将扮演一名回到临海市、临时接下深夜电台工作的成年男性。</p>
        <label for="player-name">姓名</label>
        <input id="player-name" maxlength="8" value="江临" autocomplete="off">
        <button id="confirm-name-btn" class="glass-button primary">接入 FM 00:13</button>
      </section>
    </div>

    <div id="toast" class="toast" role="status"></div>
  </main>

  <noscript>本游戏需要启用 JavaScript。</noscript>
  <script src="story.js"></script>
  <script src="story-v2.js"></script>
  <script src="game.js"></script>
</body>
</html>
